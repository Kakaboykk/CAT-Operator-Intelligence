# Alembic configuration file.
# This file is consumed by the `alembic` command line tool.

[alembic]
# Path to migration scripts
script_location = alembic

# File name template for new revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision file timestamps
timezone = UTC

# Database URL is loaded from the environment variable via env.py.
# Do NOT set sqlalchemy.url here — credentials would be committed.
# sqlalchemy.url is set dynamically in alembic/env.py

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
